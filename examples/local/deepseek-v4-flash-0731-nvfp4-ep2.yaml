recipe_version: "2"
model: nvidia/DeepSeek-V4-Flash-0731-NVFP4
model_revision: f1caa71142bd0be02f728c79f75042ac1e461579
runtime: atlas
container: atlas-deepseek-v4-0731:bringup
min_nodes: 2
max_nodes: 2
metadata:
  description: |
    Unvalidated local bring-up profile for the pinned 0731 NVFP4 checkpoint.
    Requires the modified Atlas source image on both Sparks. Ordinary serving
    only: one active request, eager execution, 2048 total prompt/output tokens.
    DSpark, prefix caching and swapping are unavailable. model_from_path pins
    the runtime weights; model_revision records provenance only.
env:
  ATLAS_EP_GRAPHS: "0"
defaults:
  port: 8888
  host: 0.0.0.0
  model_from_path: /cache/huggingface/hub/models--nvidia--DeepSeek-V4-Flash-0731-NVFP4/snapshots/f1caa71142bd0be02f728c79f75042ac1e461579
  tensor_parallel: 1
  ep_size: 2
  max_model_len: 2048
  max_batch_size: 1
  max_num_seqs: 1
  max_prefill_tokens: 2048
  swap_space_gb: 0
  kv_cache_dtype: fp8
  gpu_memory_utilization: 0.90
  oom_guard_mb: 512
  speculative: false
  dflash: false
  self_speculative: false
  ngram_speculative: false
  enable_prefix_caching: false
  high_speed_swap: false
